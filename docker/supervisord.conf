; OpenNebula supervisord configuration
; Manages oned, fireedge, oneflow, and onegate services

[program:oned]
command=/usr/bin/oned -f
user=oneadmin
autostart=true
autorestart=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true
priority=10

[program:fireedge]
command=/usr/bin/node /usr/lib/one/fireedge/dist/index.js
user=oneadmin
autostart=true
autorestart=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true
priority=20

[program:oneflow]
command=/usr/bin/ruby /usr/lib/one/oneflow/oneflow-server.rb
user=oneadmin
autostart=true
autorestart=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true
priority=20
startretries=30
startsecs=5

[program:onegate]
command=/usr/bin/ruby /usr/lib/one/onegate/onegate-server.rb
user=oneadmin
autostart=true
autorestart=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true
priority=20
startretries=30
startsecs=5

[program:oneform-server]
; OneForm provisioning API (oneprovision/oneprovider talk to it on :13013).
; Run the ruby script directly: /usr/bin/oneform-server is a {start|stop}
; wrapper that daemonises, which supervisord cannot manage.
command=/usr/bin/ruby /usr/lib/one/oneform/oneform-server.rb
user=oneadmin
autostart=true
autorestart=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true
priority=20
startretries=30
startsecs=5

[program:oneks-server]
; OneKS: deploys Kubernetes clusters on provisioned hosts.
command=/usr/bin/ruby /usr/lib/one/oneks/oneks-server.rb
user=oneadmin
autostart=true
autorestart=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true
priority=20
startretries=30
startsecs=5
