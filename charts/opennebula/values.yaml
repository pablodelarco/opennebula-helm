# OpenNebula Helm Chart Values
# See: https://github.com/pablodelarco/opennebula-helm

## Image configuration
image:
  repository: opennebula/opennebula
  ## Defaults to the chart's appVersion when empty, so each chart release
  ## deploys the exact OpenNebula version it was published for
  tag: ""
  pullPolicy: IfNotPresent

## OpenNebula settings
opennebula:
  ## Admin password for oneadmin user
  ## Default: opennebula (override in production!)
  adminPassword: "opennebula"

  ## HOSTNAME for oned.conf - address advertised to hypervisors for driver operations
  ## Options:
  ##   - "" (empty/default) - uses StatefulSet FQDN for stable identity
  ##   - "auto" - let OpenNebula auto-detect (may fail in containers)
  ##   - explicit hostname/IP - use specific value
  ## The default constructs: {release}-opennebula-0.{release}-opennebula-headless.{namespace}.svc.cluster.local
  hostname: ""

  ## MONITOR_ADDRESS for monitord.conf - where hypervisors send monitoring data
  ## Options:
  ##   - "" (empty/default) - uses auto-detection
  ##   - "auto" - same as empty, auto-detect
  ##   - explicit IP/hostname - use specific value
  ## For external hypervisors, set to LoadBalancer IP or NodePort-accessible IP
  monitorAddress: ""

## Database
## This chart deploys OpenNebula with the SQLite backend, which is the default
## for a stock OpenNebula front-end and needs no external database. The file
## lives on the persistent volume at /var/lib/one/one.db, so it survives pod
## restarts. This keeps the chart self-contained: install it and it works.
## Persistence for OpenNebula data (/var/lib/one)
persistence:
  enabled: true
  size: 20Gi
  ## storageClass: ""  # Use cluster default
  accessMode: ReadWriteOnce

## Service configuration
service:
  type: ClusterIP
  ## Ports exposed
  ## oned: 2633, sunstone: 9869, fireedge: 2616
  ## oneflow: 2474, onegate: 5030

## FireEdge proxy configuration (handles __HOST__ replacement)
## Enabled by default - required for web UI to work correctly
fireedgeProxy:
  enabled: true

  ## Optional: Override auto-detected public URL
  ## Leave empty for auto-detection (recommended)
  ## Set only if you need a specific URL different from how users access it
  publicURL: ""

  ## Nginx image for sidecar
  image:
    repository: nginx
    tag: "1.27-alpine"

  ## Resources for nginx sidecar (lightweight)
  resources:
    limits:
      cpu: 100m
      memory: 64Mi
    requests:
      cpu: 10m
      memory: 16Mi

## Ingress configuration for FireEdge web UI
ingress:
  enabled: false
  className: ""
  annotations: {}
  hostname: opennebula.local
  ## TLS configuration
  tls:
    enabled: false
    secretName: ""  # Name of TLS secret

## SSH keys for hypervisor communication
## If not provided, keys will be generated and stored in a persistent secret
ssh:
  ## Provide existing keys (base64 encoded)
  # privateKey: ""
  # publicKey: ""

## VNM Transparent Proxy configuration
## Required for VMs to access OneGate when using isolated virtual networks
## Note: This is hypervisor-side configuration - the chart provides documentation
## and suggested values. Actual configuration happens on hypervisors via onehost sync.
vnm:
  tproxy:
    ## Enable transparent proxy mode documentation in NOTES.txt
    enabled: false
    ## Remote address for OneGate proxy (frontend address reachable from hypervisors)
    ## If empty, uses the Service address. For external hypervisors, use LoadBalancer IP.
    onegateRemoteAddr: ""

## Resource limits and requests
## No defaults - set based on your environment
## Resource requests and limits for the OpenNebula front-end container.
## Measured idle usage of the full stack (oned + fireedge + oneflow + onegate
## + monitoring drivers) is ~500 MiB and ~15m CPU with no hosts and no VMs.
## Memory grows with the number of hosts, VMs and FireEdge sessions, so the
## request leaves ~2x headroom and the limit allows a small/medium cloud.
## OpenNebula does not publish a front-end sizing table; these come from
## measurement. Raise the limit for larger infrastructures.
resources:
  requests:
    cpu: 250m
    memory: 1Gi
  limits:
    cpu: "2"
    memory: 2Gi

## Pod security context
podSecurityContext: {}

## Container security context
securityContext: {}

## Node selector
nodeSelector: {}

## Tolerations
tolerations: []

## Affinity
affinity: {}
